<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takipçi Talep Sistemi</title>
</head>

<body>

<h1>Takipçi Talep Sistemi</h1>

<input id="username" type="text" placeholder="@kullaniciadi">

<button onclick="talepOlustur()">Talep Oluştur</button>

<p id="message"></p>

<script>

const SUPABASE_URL = "https://weixrcavihkfdsfaoedk.supabase.co";
const SUPABASE_KEY ="sb_publishable_NiWshcKPtaf_SdudMu5yEA_IjV8yXbv";

async function talepOlustur() {

    const input = document.getElementById("username");
    const message = document.getElementById("message");

    let username = input.value.trim().replace(/^@/, "");

    if (!username) {
        message.textContent = "Kullanıcı adını gir.";
        return;
    }

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/takipci_talepleri",
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                    kullanici_adi: username
                })
            }
        );

        if (!response.ok) {
            throw new Error("Talep gönderilemedi");
        }

        message.textContent = "✅ Talep başarıyla oluşturuldu!";
        input.value = "";

    } catch (error) {

        message.textContent = "❌ Talep gönderilemedi.";

    }
}

</script>

</body>
</html>
